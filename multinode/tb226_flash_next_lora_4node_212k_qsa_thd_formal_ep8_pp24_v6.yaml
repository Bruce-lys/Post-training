# Qwen3.8-Flash-Next LoRA SFT | 4 nodes x 8 H200 | QSA THD formal, v6 (2026-09-18) = v5 + PYTORCH_CUDA_ALLOC_CONF
# v5 -> v6: the allocator setting was passed as PYTORCH_ALLOC_CONF, which torch 2.9.1 ignores (verified with a
#   memory-history probe: no segment_map events). PYTORCH_CUDA_ALLOC_CONF actually enables expandable segments,
#   which is the intended fragmentation control behind the step-299 OOM. Math-neutral.
# v3 -> v5:
#   external_plugins += cuda_cache_release.py : torch.cuda.empty_cache() before each microbatch forward and after
#     each step. Fixes the step-299 OOM (last PP stage: 49.4 GiB live, 62.5 GiB fragmented cache, a 23.55 GiB fp32
#     logits allocation for a 204k-token microbatch failed with 19.4 GiB physically free). Math-neutral.
#   resume: mcore_adapter -> v3 checkpoint-250, finetune: false (loads optimizer, rng and iteration 250)
# Cross-entropy stays native/fused: TE 2.14 fused CE stores dL/dlogits in bf16 during forward (Megatron-LM #5115,
#   fixed only in TE >= 2.18/2.19), so it is NOT used for the formal run.
# Everything else identical to v3 (EP=8, PP 24/24, no optimizer CPU offload, packing=false, dp_balance_order).
ENV:
  NPROC_PER_NODE: 8
  CUDA_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
  CUDA_DEVICE_MAX_CONNECTIONS: 1
  PYTHONUNBUFFERED: 1
  PYTORCH_ALLOC_CONF: expandable_segments:True,garbage_collection_threshold:0.8
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,garbage_collection_threshold:0.8   # torch 2.9.1 in .venv-swift only honours this name (probe 2026-09-18); PYTORCH_ALLOC_CONF was silently ignored
  TORCHDYNAMO_DISABLE: 1
  TORCH_COMPILE_DISABLE: 1
  USE_MCORE_GDN: 'True'
  QSA_SPARSE_KERNEL: 'True'
  PLE_CHUNK_SIZE: 16384
  DP_BALANCE_ORDER: 'True'
  DP_BALANCE_LENGTHS_FILE: /kwkj-k8s/llm_team/lys/megatron-swift/data_analysis/tb226_v3_lengths_by_row.json
  MODELSCOPE_CACHE: /kwkj-k8s/llm_team/lys/megatron-swift/.cache/modelscope
  HF_HOME: /kwkj-k8s/llm_team/lys/megatron-swift/.cache/huggingface
  NCCL_IB_HCA: ib7s400
  NCCL_SOCKET_IFNAME: ib6s200p0
  GLOO_SOCKET_IFNAME: ib6s200p0
  NCCL_DEBUG: WARN
  TORCH_NCCL_ASYNC_ERROR_HANDLING: 1
model: /kwkj-k8s/llm_team/models/Qwen3.8-Flash-Next
